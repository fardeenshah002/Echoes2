<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES - Next-Gen Audio Streaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f3ff', 500: '#6366f1', 600: '#4f46e5', 900: '#0f172a', dark: '#090d16' }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body id="bodyTheme" class="bg-[#070a10] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <header class="sticky top-0 z-40 glass border-b border-slate-800/80 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div id="logoIcon" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-wave-square text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">ECHOES</h1>
                <p class="text-[10px] text-indigo-400 tracking-widest uppercase">Pro Audio Suite</p>
            </div>
        </div>

        <div class="relative max-w-md w-full mx-4 hidden md:block">
            <button id="deskSearchBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-400 transition z-10"><i class="fa-solid fa-magnifying-glass"></i></button>
            <input type="text" id="searchInput" placeholder="Search songs, artists, albums..." class="w-full bg-slate-900/90 border border-slate-700/60 rounded-full py-2.5 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        </div>
        <div class="flex items-center gap-3 w-10"></div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 mb-32">
        <section class="lg:col-span-2 space-y-6">
            <div class="flex items-center gap-2 border-b border-slate-800 pb-3 overflow-x-auto">
                <button onclick="switchTab('discover')" id="tab-discover" class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition shadow-md shadow-indigo-600/30">Discover</button>
                <button onclick="switchTab('playlists')" id="tab-playlists" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Playlists & Liked</button>
                <button onclick="switchTab('equalizer')" id="tab-equalizer" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Equalizer & FX</button>
                <button onclick="switchTab('lyrics')" id="tab-lyrics" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition">Live Lyrics</button>
            </div>

            <div class="relative w-full md:hidden">
                <button id="mobSearchBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-400 transition z-10"><i class="fa-solid fa-magnifying-glass"></i></button>
                <input type="text" id="mobileSearchInput" placeholder="Search songs..." class="w-full bg-slate-900/90 border border-slate-700/60 rounded-full py-2 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-400">
            </div>

            <div id="content-discover" class="space-y-4">
                <div class="glass-panel p-6 rounded-2xl">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-fire text-indigo-400"></i> Trending & Search Results</h2>
                    </div>
                    <div id="songsList" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
                </div>
            </div>

            <div id="content-playlists" class="space-y-4 hidden">
                <div class="glass-panel p-6 rounded-2xl space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-heart text-rose-500"></i> Liked Songs</h2>
                        <button onclick="clearLiked()" class="text-xs text-slate-400 hover:text-rose-400 transition">Clear All</button>
                    </div>
                    <div id="likedSongsList" class="space-y-2 max-h-[450px] overflow-y-auto pr-1"></div>
                </div>
            </div>

            <div id="content-equalizer" class="space-y-4 hidden">
                <div class="glass-panel p-6 rounded-2xl space-y-6">
                    <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2"><i class="fa-solid fa-sliders text-indigo-400"></i> Pro Audio Equalizer</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-center"><label class="text-xs text-slate-400 block mb-2">Bass</label><input type="range" min="-20" max="20" value="0" class="w-24 accent-indigo-500 cursor-pointer"></div>
                        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-center"><label class="text-xs text-slate-400 block mb-2">Mid</label><input type="range" min="-20" max="20" value="0" class="w-24 accent-indigo-500 cursor-pointer"></div>
                        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-center"><label class="text-xs text-slate-400 block mb-2">Treble</label><input type="range" min="-20" max="20" value="0" class="w-24 accent-indigo-500 cursor-pointer"></div>
                    </div>
                </div>
            </div>

            <div id="content-lyrics" class="space-y-4 hidden">
                <div class="glass-panel p-6 rounded-2xl text-center space-y-4 min-h-[350px] flex flex-col justify-start items-center relative">
                    <h2 class="text-sm font-semibold text-indigo-400 uppercase tracking-widest sticky top-0 bg-[#0f172a]/90 w-full p-2 z-10 backdrop-blur-md rounded-lg">Live Lyrics</h2>
                    <div id="lyricsContainer" class="text-slate-300 text-sm max-h-[300px] overflow-y-auto px-4 w-full pt-4">
                        <p class="text-slate-500 italic mt-10">Play a track to load real lyrics...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-6">
            <div class="glass-panel p-6 rounded-2xl flex flex-col items-center">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 w-full flex items-center justify-between"><span>Audio Spectrum</span><i class="fa-solid fa-chart-simple text-indigo-400"></i></h3>
                <canvas id="visualizer" class="w-full h-36 rounded-xl bg-slate-950/80 border border-slate-800/80"></canvas>
            </div>
            <div class="glass-panel p-6 rounded-2xl space-y-4">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between"><span>Now Playing</span><i class="fa-solid fa-circle-info text-indigo-400"></i></h3>
                <div class="flex items-center gap-4">
                    <img id="nowPlayingArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" class="w-16 h-16 rounded-xl object-cover border border-slate-700 shadow-md">
                    <div class="overflow-hidden flex-1">
                        <p id="nowPlayingTitle" class="font-semibold text-sm text-slate-100 truncate">Select a song</p>
                        <p id="nowPlayingArtist" class="text-xs text-slate-400 truncate">ECHOES</p>
                    </div>
                    <button id="likeTrackBtn" onclick="toggleLikeCurrent()" class="text-slate-500 hover:text-rose-500 text-xl transition"><i class="fa-solid fa-heart"></i></button>
                </div>
            </div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-1/4">
                <img id="dockArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="w-12 h-12 rounded-lg object-cover border border-slate-700">
                <div class="truncate">
                    <p id="dockTitle" class="text-sm font-medium text-slate-100 truncate">Ready</p>
                    <p id="dockArtist" class="text-xs text-slate-400 truncate">Play</p>
                </div>
            </div>
            <div class="flex flex-col items-center gap-1.5 w-2/4 max-w-md">
                <div class="flex items-center gap-6">
                    <button id="prevBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-backward-step text-lg"></i></button>
                    <button id="playBtn" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition"><i class="fa-solid fa-play text-sm ml-0.5" id="playIcon"></i></button>
                    <button id="nextBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-forward-step text-lg"></i></button>
                </div>
                <div class="w-full flex items-center gap-2 text-xs text-slate-400">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 w-1/4">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="w-20 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const searchInput = document.getElementById('searchInput');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        const songsList = document.getElementById('songsList');
        const likedSongsList = document.getElementById('likedSongsList');

        let currentTracks = [];
        let currentIndex = 0;
        let likedTracks = JSON.parse(localStorage.getItem('echoes_liked') || '[]');

        function switchTab(tabName) {
            ['discover', 'playlists', 'equalizer', 'lyrics'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-4 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition";
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).className = "px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition shadow-md shadow-indigo-600/30";
            if (tabName === 'playlists') renderSongs(likedTracks, likedSongsList);
        }

        async function fetchSongs(query = 'Arijit Singh') {
            songsList.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm"><i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-3 block"></i>Searching tracks...</div>`;
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
                const data = await res.json();
                currentTracks = data.results.filter(item => item.previewUrl);
                renderSongs(currentTracks, songsList);
            } catch (err) {
                songsList.innerHTML = `<p class="text-rose-400 text-center py-8">Failed to fetch songs.</p>`;
            }
        }

        function renderSongs(tracks, container) {
            if (!tracks.length) { container.innerHTML = `<p class="text-slate-400 text-center py-8">No tracks found.</p>`; return; }
            container.innerHTML = tracks.map((track, idx) => {
                const isLiked = likedTracks.some(t => t.trackId === track.trackId);
                return `<div class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800/60 transition group border border-transparent hover:border-slate-700/50">
                    <div onclick="playTrack(${idx})" class="flex items-center gap-3 cursor-pointer flex-1 overflow-hidden">
                        <img src="${track.artworkUrl100}" class="w-11 h-11 rounded-lg object-cover">
                        <div class="truncate">
                            <p class="text-sm font-medium text-slate-100 truncate">${track.trackName}</p>
                            <p class="text-xs text-slate-400 truncate">${track.artistName}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick='toggleLike(${JSON.stringify(track).replace(/'/g, "&apos;")})' class="text-slate-500 hover:text-rose-500 transition text-sm">
                            <i class="${isLiked ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function playTrack(index) {
            currentIndex = index;
            const track = currentTracks[index];
            if (!track) return;
            audio.src = track.previewUrl; audio.play();
            document.getElementById('nowPlayingArt').src = track.artworkUrl100;
            document.getElementById('nowPlayingTitle').innerText = track.trackName;
            document.getElementById('dockArt').src = track.artworkUrl100;
            document.getElementById('dockTitle').innerText = track.trackName;
            playIcon.className = 'fa-solid fa-pause text-sm';
            
            // Call Lyrics API
            fetchLyrics(track.artistName, track.trackName);
        }

        async function fetchLyrics(artist, title) {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = `<div class="mt-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-3 block"></i><p class="text-indigo-400 font-semibold animate-pulse">Finding lyrics...</p></div>`;
            try {
                // Clean strings for better API matching
                const cleanTitle = title.split(' (')[0].split(' - ')[0];
                const cleanArtist = artist.split(' & ')[0];
                
                const res = await fetch(`https://api.lyrics.ovh/v1/${cleanArtist}/${cleanTitle}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                
                if (data.lyrics) {
                    const formatted = data.lyrics.replace(/\n/g, '<br>');
                    container.innerHTML = `<div class="text-slate-200 leading-loose pb-8 text-center">${formatted}</div>`;
                } else {
                    throw new Error('Empty');
                }
            } catch (err) {
                container.innerHTML = `
                    <p class="text-indigo-400 font-semibold mb-4 mt-10">♪ ${title} ♪</p>
                    <p class="text-slate-400 italic">Real-time lyrics not available for this specific track.</p>
                `;
            }
        }

        function toggleLike(track) {
            const idx = likedTracks.findIndex(t => t.trackId === track.trackId);
            if (idx > -1) likedTracks.splice(idx, 1);
            else likedTracks.push(track);
            localStorage.setItem('echoes_liked', JSON.stringify(likedTracks));
            renderSongs(currentTracks, songsList);
        }

        playBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) { audio.play(); playIcon.className = 'fa-solid fa-pause text-sm'; }
            else { audio.pause(); playIcon.className = 'fa-solid fa-play text-sm ml-0.5'; }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) progressBar.value = (audio.currentTime / audio.duration) * 100;
        });
        progressBar.addEventListener('input', () => { if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration; });
        document.getElementById('volumeSlider').addEventListener('input', (e) => audio.volume = e.target.value);

        function executeSearch(query) {
            if (query) { fetchSongs(query); searchInput.value = query; mobileSearchInput.value = query; }
        }
        
        [searchInput, mobileSearchInput].forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); executeSearch(input.value.trim()); }
            });
        });

        document.getElementById('deskSearchBtn').addEventListener('click', () => executeSearch(searchInput.value.trim()));
        document.getElementById('mobSearchBtn').addEventListener('click', () => executeSearch(mobileSearchInput.value.trim()));

        // Visualizer Canvas Animation
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        function drawVisualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const bars = 25;
            const barWidth = canvas.width / bars;
            for (let i = 0; i < bars; i++) {
                const barHeight = audio.paused ? 6 : Math.random() * (canvas.height - 12) + 6;
                ctx.fillStyle = '#6366f1';
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();

        fetchSongs('The Weeknd');
    </script>
</body>
</html>
